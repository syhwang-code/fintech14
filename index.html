<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 GitHub 홈페이지</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #e8f3ff;
      color: #0969da;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #1f2328;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #59636e;
      margin-bottom: 24px;
    }
    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .skill-tag {
      background-color: #f6f8fa;
      border: 1px solid #d0d7de;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .btn {
      display: inline-block;
      background-color: #2da44e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      transition: background-color 0.2s;
      cursor: pointer;
      border: none;
      font-size: 15px;
    }
    .btn:hover {
      background-color: #2c974b;
    }
    #msg {
      margin-top: 16px;
      font-size: 14px;
      color: #0969da;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">GitHub 실습 프로젝트</span>
    <h1>안녕하세요! 👋<br>저의 첫 홈페이지입니다.</h1>
    <p>
      GitHub 저장소를 만들고 첫 번째 웹페이지를 배포해 보았습니다.<br>
      앞으로 이곳에 다양한 공부 기록을 채워나갈 예정입니다.
    </p>

    <div class="skills">
      <span class="skill-tag">HTML5</span>
      <span class="skill-tag">CSS3</span>
      <span class="skill-tag">Git & GitHub</span>
    </div>

    <button class="btn" onclick="showMessage()">인사 건네기</button>
    <div id="msg"></div>
  </div>

  <script>
    function showMessage() {
      const msgBox = document.getElementById('msg');
      msgBox.textContent = "방문해 주셔서 감사합니다! 오늘도 즐거운 코딩 되세요 🎉";
    }
  </script>

</body>
</html>
